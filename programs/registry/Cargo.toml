[package]
name = "ghostlink-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
# Built and deployed from this repository; not published to crates.io.
publish = false
description = "GhostLink registry: one wallet, one commitment, appended once to an incremental Merkle tree. No update, no delete, no admin."

[lib]
crate-type = ["cdylib", "lib"]
name = "ghostlink_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Declared so the cfgs that Anchor's macros emit are known to rustc; none is enabled by default.
anchor-debug = []
custom-heap = []
custom-panic = []
# Which cluster string registration messages must carry.
mainnet = []

[dependencies]
anchor-lang = "0.32.1"
ghostlink-verifier = { path = "../verifier" }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
