[package]
name = "ghostlink-census"
version.workspace = true
edition.workspace = true
license.workspace = true
# Built and deployed from this repository; not published to crates.io.
publish = false
description = "GhostLink census: permissionless holdings snapshots appended to an incremental Merkle tree, so balance claims can be proved without revealing the wallet."

[lib]
crate-type = ["cdylib", "lib"]
name = "ghostlink_census"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Declared so the cfgs that Anchor's macros emit are known to rustc; none is enabled by default.
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
ghostlink-verifier = { path = "../verifier" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
